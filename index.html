<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/my-react-app/manifest.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>

  }
</script>
